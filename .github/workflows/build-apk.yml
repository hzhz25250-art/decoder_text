name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o decoder-apk.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: decoder-apk
        run: npm install

      - name: Generate Android project
        working-directory: decoder-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: decoder-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: decoder-apk
          path: decoder-apk/android/app/build/outputs/apk/debug/app-debug.apk
